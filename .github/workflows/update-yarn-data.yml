name: Update official yarn data

on:
  push:
    branches: [main]
    paths:
      - 'scripts/scrape_yarn.py'
      - 'package.json'
  schedule:
    - cron: '17 2 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install scraper dependencies
        run: python -m pip install --upgrade pip requests beautifulsoup4 pdfplumber

      - name: Scrape official TXC and NTC publications
        run: python scripts/scrape_yarn.py

      - name: Commit refreshed dataset
        run: |
          git config user.name 'textile-data-bot'
          git config user.email 'textile-data-bot@users.noreply.github.com'
          git add data/yarn.json
          if git diff --cached --quiet; then
            echo 'No dataset changes.'
          else
            git commit -m 'chore(data): refresh official yarn prices'
            git push
          fi
