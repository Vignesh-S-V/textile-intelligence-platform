name: Validate application
on:
  push:
    branches: [main, qa-hardening-2026-09-10, fix/forecast-production-runtime]
  pull_request:
    branches: [main]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install
      - run: python -m pip install -r requirements.txt
      - run: node --check server.js
      - run: node --check app.js
      - run: node --check forecast.js
      - run: python -m py_compile forecast.py
      - name: Forecast engine smoke test
        run: |
          python - <<'PY'
          import json, subprocess
          with open('data/yarn.json', encoding='utf-8') as f:
              records = json.load(f)['records']
          selected = [r for r in records if r.get('fiber') == 'Cotton' and r.get('product') == 'Cotton Yarn' and r.get('yarn_type') == 'Combed Yarn' and r.get('count') == '20s']
          assert len(selected) >= 12, f'Insufficient smoke-test records: {len(selected)}'
          p = subprocess.run(['python', 'forecast.py'], input=json.dumps({'records': selected, 'horizon': 3}), text=True, capture_output=True, check=True)
          result = json.loads(p.stdout)
          assert result.get('ok') is True, result
          assert len(result.get('forecast', [])) == 3, result
          assert all(isinstance(x.get('price'), (int, float)) and x['price'] > 0 for x in result['forecast']), result
          print('FORECAST SMOKE TEST OK:', result['model'], result['monthly_points'], 'monthly points')
          with open('/tmp/forecast-payload.json', 'w', encoding='utf-8') as f:
              json.dump({'records': selected, 'horizon': 3}, f)
          PY
      - name: Any-history regression test
        run: |
          python - <<'PY'
          import json, subprocess
          for n in (1, 2, 3, 6, 10, 12):
              records = [
                  {'date': f'{2025 + (i // 12)}-{(i % 12) + 1:02d}-01', 'price_inr_kg': 100 + i * 1.5}
                  for i in range(n)
              ]
              p = subprocess.run(['python', 'forecast.py'], input=json.dumps({'records': records, 'horizon': 3}), text=True, capture_output=True, check=True)
              result = json.loads(p.stdout)
              assert result.get('ok') is True, (n, result)
              assert result.get('monthly_points') == n, (n, result)
              assert len(result.get('forecast', [])) == 3, (n, result)
              assert all(isinstance(x.get('price'), (int, float)) and x['price'] > 0 for x in result['forecast']), (n, result)
              print('ANY-HISTORY OK:', n, 'months ->', result['model'])
          PY
      - name: Start application
        run: nohup npm start >/tmp/textile-intelligence.log 2>&1 &
      - name: Wait for health endpoint
        run: |
          for i in {1..30}; do curl -fsS http://127.0.0.1:10000/health && exit 0; sleep 2; done
          cat /tmp/textile-intelligence.log
          exit 1
      - name: Forecast API integration test
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST http://127.0.0.1:10000/api/forecast \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/forecast-payload.json \
            -o /tmp/forecast-response.json
          python - <<'PY'
          import json
          with open('/tmp/forecast-response.json', encoding='utf-8') as f:
              result = json.load(f)
          assert result.get('ok') is True, result
          assert len(result.get('forecast', [])) == 3, result
          print('FORECAST HTTP API TEST OK:', result['model'])
          PY
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser E2E forecast test
        run: npm run e2e
      - name: Show application log on failure
        if: failure()
        run: cat /tmp/textile-intelligence.log
