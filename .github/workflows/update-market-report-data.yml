name: Update market-report yarn data

on:
  push:
    branches: [main]
    paths:
      - 'scripts/scrape_market_reports.py'
      - 'data/live_yarn.json'
      - '.github/workflows/update-market-report-data.yml'
  schedule:
    - cron: '47 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-report-refresh
  cancel-in-progress: false

jobs:
  market:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install market scraper dependencies
        run: python -m pip install --upgrade pip requests beautifulsoup4
      - name: Scrape public yarn market reports
        run: python scripts/scrape_market_reports.py
      - name: Validate market-report dataset
        run: |
          python - <<'PY'
          import json
          d=json.load(open('data/live_yarn.json',encoding='utf-8'))
          rows=d.get('records',[])
          assert isinstance(rows,list), 'Market records must be a list'
          keys=set()
          for r in rows:
              assert r.get('date') and r.get('source_url'), 'Market record missing date/source URL'
              assert r.get('source_tier')=='MARKET_INDICATOR', 'Wrong market source tier'
              assert r.get('price_min_inr_kg') is not None and r.get('price_max_inr_kg') is not None, 'Market price missing'
              assert r['price_min_inr_kg'] <= r['price_max_inr_kg'], 'Invalid market price range'
              key=(r.get('source_short'),r.get('source_url'),r.get('date'),r.get('market'),r.get('count'),r.get('yarn_type'),r.get('price_min_inr_kg'),r.get('price_max_inr_kg'))
              assert key not in keys, 'Duplicate market record detected'
              keys.add(key)
          print('MARKET VALIDATION OK:',len(rows),'records; latest=',max((r['date'] for r in rows),default='none'))
          PY
      - name: Commit market-report dataset
        run: |
          git config user.name 'textile-data-bot'
          git config user.email 'textile-data-bot@users.noreply.github.com'
          git add data/live_yarn.json
          if git diff --cached --quiet; then echo 'No market dataset changes.'; else git commit -m 'chore(data): refresh market-report yarn prices'; git fetch origin main; git rebase origin/main; git push origin HEAD:main; fi
